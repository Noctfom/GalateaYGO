name: Check website

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check registry and publishing data
        run: npm test
      - name: Build production website
        run: npm run build
